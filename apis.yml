name: Abstract API Phone Validation
kind: company
description: >-
  Abstract API's Phone Number Validation & Verification API validates and
  verifies a phone number in a single REST request. Given a number (ideally in
  E.164 format) it returns whether the number is valid, its local and
  international formats, the country, the registered location, the line type
  (mobile, landline, VoIP, and more), and the carrier - useful for form
  validation, lead scoring, fraud prevention, and cleaning phone data. The
  endpoint is a single authenticated GET call with the API key passed as a query
  parameter, and Abstract offers a free tier alongside paid plans. Phone
  Validation is one product in the broader Abstract API suite, which also
  includes email validation, IP geolocation, company enrichment, and other data
  APIs; each product has its own host and its own API key.
