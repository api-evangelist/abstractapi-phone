description: >-
  FinOps view of Abstract API Phone Validation spend. The API is billed on a
  freemium, request-metered model: a free tier (100 requests/month) and paid
  monthly/annual plans whose price is driven by the included monthly request
  volume. The effective unit of cost is a single validation request (one phone
  number verified). Spend is bounded by the plan's monthly allowance rather than
  pure pay-as-you-go overage, so cost control centers on right-sizing the plan
  tier to expected verification volume and caching/deduplicating repeat lookups.
  Per-plan dollar figures are not reconciled here.
notes: >-
  Abstract meters and bills each API product separately, so a Phone Validation
  plan is a distinct line item from any other Abstract API product. Verify
  current tier prices and included volumes on the Abstract API pricing page
  during reconciliation. Per-lookup economics are modeled from published plan
  volumes and prices, not from an invoice.
