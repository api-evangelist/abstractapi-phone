meters:
- name: validation_requests
  description: Phone number validation/verification requests, counted against the plan's monthly allowance.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track monthly validation request counts against the plan allowance to avoid overage or forced tier upgrades.
- name: Allocation
  description: Attribute request volume to the product/team/form driving phone verification so cost maps to a cost center.
- name: Optimization
  description: Cache and deduplicate repeat lookups of the same number, validate only where needed (e.g. at signup), and right-size the plan tier to actual monthly volume.
- name: Accountability
  description: Assign an owner for the Abstract API account; review monthly usage against the plan allowance and reconcile the modeled tiers against the live pricing page.
